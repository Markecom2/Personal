<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Command Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f5f4f0;--s:#ffffff;--s2:#faf9f6;--ink:#1c1f24;--m:#6a707b;--faint:#9aa0a9;--line:#e6e3dc;
  --a:#0f766e;--a2:#e6f2f0;--warn:#b45309;--warn2:#fdf1e2;--bad:#c0392b;--bad2:#fbe9e7;--star:#d99a06;
  --email:#2563eb;--slack:#7c3aed;--monday:#e11d48;
  --r:14px;--shadow:0 1px 2px rgba(20,20,20,.04),0 6px 20px rgba(20,20,20,.05);color-scheme:light
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121417;--s:#1b1e23;--s2:#171a1e;--ink:#eceef1;--m:#9aa1ad;--faint:#6f7682;--line:#2c3038;
  --a:#3cc0ae;--a2:#173230;--warn:#f0a44b;--warn2:#3a2a14;--bad:#ff7d73;--bad2:#3b1d1a;--star:#f2c14e;
  --email:#7aa7ff;--slack:#b394ff;--monday:#ff7a96;--shadow:none;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Cabin",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 96px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px 0 14px}
.hello h1{margin:0;font-size:26px;letter-spacing:-.015em;line-height:1.2}
.hello p{margin:2px 0 0;color:var(--m);font-size:15px}
.tools{display:flex;gap:6px;align-items:center;flex-shrink:0}
.iconbtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid var(--line);background:var(--s);border-radius:999px;color:var(--m);font-size:14px}
.iconbtn:hover{color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--a)}
.dot.warn{background:var(--warn)}
.spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.headline{margin:0 0 14px;padding:10px 14px;border-radius:12px;background:var(--a2);color:var(--ink);font-size:14.5px}
.headline b{color:var(--a)}

/* tabs */
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;display:flex;gap:4px}
nav.tabs button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:10px;color:var(--m);font-weight:600;font-size:15px;display:flex;justify-content:center;align-items:center;gap:6px}
nav.tabs button[aria-selected="true"]{background:var(--s);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line)}
.count{font-size:12px;font-weight:700;min-width:20px;padding:1px 6px;border-radius:999px;background:var(--line);color:var(--m)}
nav.tabs button[aria-selected="true"] .count{background:var(--a);color:#fff}

/* add bar */
form.add{display:flex;gap:8px;background:var(--s);border:1px solid var(--line);border-radius:var(--r);padding:6px 6px 6px 14px;box-shadow:var(--shadow);margin-bottom:18px}
form.add input{flex:1;min-width:0;border:0;background:transparent;padding:8px 0;font-size:16px}
form.add input:focus{outline:none}
form.add:focus-within{border-color:var(--a)}
form.add select{border:1px solid var(--line);background:var(--s2);border-radius:10px;padding:0 8px;color:var(--m);font-size:14px}
.btn{border:1px solid var(--line);background:var(--s);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--a);border-color:var(--a);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--m)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}

/* sections & lists */
section.block{margin:0 0 22px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 2px 8px}
.sechead h2{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--m)}
.sechead .hint{font-size:13px;color:var(--faint)}
.sechead a,.linkbtn{font-size:14px;color:var(--a);background:none;border:0;padding:0;font-weight:600}
ul.list{list-style:none;margin:0;padding:0;background:var(--s);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
ul.list>li{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line);min-height:56px}
ul.list>li:first-child{border-top:0}
.progress{display:flex;align-items:center;gap:10px;margin:0 2px 18px;color:var(--m);font-size:14px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--a);border-radius:99px;transition:width .3s}

.check{flex-shrink:0;width:24px;height:24px;border-radius:50%;border:2px solid var(--faint);background:transparent;display:grid;place-items:center;padding:0;color:transparent}
.check:hover{border-color:var(--a);color:var(--a)}
.check.on{background:var(--a);border-color:var(--a);color:#fff}
.check svg{width:14px;height:14px}
.body{flex:1;min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.t{font-size:16px;overflow-wrap:anywhere}
.done .t{color:var(--faint);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:3px;font-size:13px;color:var(--m);align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--s2);border:1px solid var(--line);color:var(--m)}
.tag.warn{background:var(--warn2);border-color:transparent;color:var(--warn)}
.tag.bad{background:var(--bad2);border-color:transparent;color:var(--bad)}
.tag.ok{background:var(--a2);border-color:transparent;color:var(--a)}
.src{width:28px;height:28px;flex-shrink:0;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.src.email{background:var(--email)}.src.slack{background:var(--slack)}.src.monday{background:var(--monday)}.src.task{background:var(--a)}
.star{flex-shrink:0;width:34px;height:34px;border:0;background:transparent;border-radius:8px;color:var(--faint);font-size:19px;line-height:1;padding:0}
.star[aria-pressed="true"]{color:var(--star)}
.star:hover{background:var(--s2)}
.rowact{display:flex;gap:6px;flex-shrink:0}
.rowact .btn{padding:6px 10px;font-size:13px}
.empty{padding:22px 18px;text-align:center;color:var(--m);font-size:15px;background:var(--s);border:1px dashed var(--line);border-radius:var(--r)}
details.more{margin-top:10px}
details.more summary{cursor:pointer;color:var(--m);font-size:14px;font-weight:600;padding:6px 2px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸ ";}
details.more[open] summary::before{content:"▾ ";}
details.more ul{margin-top:6px}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 0 12px;scrollbar-width:none}
.chips button{flex-shrink:0;border:1px solid var(--line);background:var(--s);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--m)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.search{width:100%;border:1px solid var(--line);background:var(--s);border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:15px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,15,.45);z-index:20;display:none}
.scrim.open{display:block}
.sheet{position:fixed;z-index:21;left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,calc(100vw - 32px));max-height:min(86vh,760px);overflow:auto;background:var(--s);border-radius:18px;padding:20px;display:none;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet.open{display:block}
@media (max-width:600px){.sheet{left:0;right:0;bottom:0;top:auto;transform:none;width:100%;max-height:90vh;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}}
.sheet h3{margin:0 40px 4px 0;font-size:19px;line-height:1.3;overflow-wrap:anywhere}
.sheet .close{position:absolute;right:12px;top:12px;width:36px;height:36px;border:0;border-radius:10px;background:var(--s2);font-size:20px;color:var(--m)}
.sheet .sub{color:var(--m);font-size:14px;margin:0 0 14px}
.sheet label{display:block;font-size:13px;font-weight:600;color:var(--m);margin:14px 0 6px}
.sheet textarea,.sheet input[type=text],.sheet input[type=date]{width:100%;border:1px solid var(--line);background:var(--s2);border-radius:10px;padding:10px 12px;font-size:15px}
.sheet textarea{min-height:90px;resize:vertical}
.msg{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;max-height:300px;overflow:auto}
.why{font-size:14px;color:var(--ink);background:var(--a2);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.why ol{margin:6px 0 0;padding-left:20px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--s);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;color:var(--m)}
.seg button[aria-pressed="true"]{border-color:var(--a);background:var(--a2);color:var(--a)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.actions .spacer{flex:1}
.srcrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.srcrow:first-of-type{border-top:0}
.srcrow span:last-child{color:var(--m);text-align:right}
.srcrow.err span:last-child{color:var(--bad)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:none;align-items:center;gap:12px;z-index:30;font-size:15px;max-width:calc(100vw - 32px)}
.toast.open{display:flex}
.toast button{background:transparent;border:0;color:var(--bg);font-weight:700;text-decoration:underline;padding:4px}
.loading{padding:60px 0;text-align:center;color:var(--m)}
@media (max-width:480px){
  .hello h1{font-size:22px}
  .iconbtn .lbl{display:none}
  nav.tabs button{font-size:14px;padding:9px 2px}
  .rowact .btn .lbl{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="hello"><h1 id="greet">Hello</h1><p id="dateLine"></p></div>
    <div class="tools">
      <button class="iconbtn" id="syncBtn" type="button" title="Connections and refresh"><span class="dot" id="syncDot"></span><span class="lbl" id="syncTxt">Loading</span></button>
      <form method="post" action="/logout" style="margin:0"><button class="iconbtn" type="submit" title="Sign out"><span aria-hidden="true">⎋</span><span class="lbl">Sign out</span></button></form>
    </div>
  </header>
  <p class="headline" id="headline" hidden></p>

  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" data-tab="today" aria-selected="true">Today <span class="count" id="cToday">0</span></button>
    <button role="tab" data-tab="inbox" aria-selected="false">Inbox <span class="count" id="cInbox">0</span></button>
    <button role="tab" data-tab="upcoming" aria-selected="false">Upcoming</button>
    <button role="tab" data-tab="done" aria-selected="false">Done</button>
  </nav>

  <form class="add" id="addForm" autocomplete="off">
    <label class="sr" for="addText">New task</label>
    <input id="addText" placeholder="Add a task…  (press N)" maxlength="300">
    <label class="sr" for="addDay">When</label>
    <select id="addDay"><option value="today">Today</option><option value="tomorrow">Tomorrow</option><option value="someday">Someday</option></select>
    <button class="btn primary" type="submit">Add</button>
  </form>

  <main id="view"><div class="loading">Loading your day…</div></main>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastTxt"></span><button id="toastUndo" type="button">Undo</button></div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const HOUR = 3600e3, DAY = 864e5;
  const store = { get(k, d) { try { const v = localStorage.getItem("cd2:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                  set(k, v) { try { localStorage.setItem("cd2:" + k, JSON.stringify(v)); } catch {} } };

  let S = null;                                     // server snapshot
  let tab = store.get("tab", "today");
  let inboxFilter = "all", inboxQuery = "", showLow = false;

  /* ---------- api ---------- */
  async function api(path, body) {
    const r = await fetch(path, body === undefined ? { credentials: "same-origin" } : { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (r.status === 401) { location.href = "/login"; throw new Error("Signed out"); }
    let j = {}; try { j = await r.json(); } catch {}
    if (!r.ok) throw new Error(j.error || `Request failed (${r.status})`);
    return j;
  }

  /* ---------- dates ---------- */
  const tz = () => (S && S.tz) || undefined;
  const dayOf = (ms) => new Intl.DateTimeFormat("en-CA", { timeZone: tz(), year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(ms));
  const today = () => S.today, tomorrow = () => S.tomorrow;
  const addDays = (d, n) => { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
  const niceDay = (d) => {
    if (!d) return "Someday";
    if (d === today()) return "Today"; if (d === tomorrow()) return "Tomorrow"; if (d === addDays(today(), -1)) return "Yesterday";
    return new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });
  };
  const ago = (ms) => { const m = (Date.now() - ms) / 60000; if (m < 1) return "now"; if (m < 60) return Math.round(m) + "m"; if (m < 1440) return Math.round(m / 60) + "h"; return Math.round(m / 1440) + "d"; };
  const clock = (ms) => new Date(ms).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: tz() });

  /* ---------- incoming items (email, Slack, Monday) ---------- */
  const MON_EMAIL_ACCTS = [
    { re: /mood\s*creative|moodcreative|alana cocking/i, label: "Mood Creative", url: "https://moodcreative-company.monday.com" },
    { re: /great[\s-]*escape|great-escape-gang|greatescapeau|\btge\b/i, label: "The Great Escape", url: "https://the-great-escape-gang.monday.com" }
  ];
  function tagMondayMail(m) {
    const addr = String(m.fromAddr || "").trim();
    if (/@moodcreative\.com\.au$/i.test(addr)) return { ...m, client: "Mood Creative" };
    if (/@greatescapeau\.com$/i.test(addr)) return { ...m, client: "The Great Escape" };
    if (!/^notifications@monday\.com$/i.test(addr)) return m;
    const blob = `${m.from} ${m.subject} ${m.preview}`, acct = MON_EMAIL_ACCTS.find((a) => a.re.test(blob));
    const kind = (m.subject.match(/^\[([^\]]+)\]/) || [])[1] || "Update";
    const subject = m.subject.replace(/^\[[^\]]+\]\s*/, "");
    return { ...m, mondayMail: true, from: String(m.from).replace(/\s+via monday\.com$/i, ""), subject: `${kind}: ${subject}`, monAcct: acct ? acct.label : "Monday", link: m.mondayLink || (acct ? acct.url : ""), client: acct ? acct.label : "" };
  }
  const RANK = { critical: 0, high: 1, normal: 2, low: 3, fyi: 4 };
  const PROMO = /no-?reply|newsletter|marketing|promo|notifications?@|email@email|mailer|digest/i;
  function quick(it) {
    if (it.source === "monday" && it.kind === "task") {
      const overdue = it.due && it.due < today(), stuck = /stuck|changes required/i.test(it.status);
      if (/de-prioriti/i.test(it.status)) return "fyi";
      if (stuck && (overdue || it.due === today())) return "critical";
      if (overdue || it.due === today() || stuck || it.clientReplied) return "high";
      if (/waiting|sent to client|approved/i.test(it.status)) return "low";
      return "normal";
    }
    const blob = `${it.subject} ${it.preview}`;
    if (it.mondayMail) {
      if (/overdue|stuck|urgent|asap|changes required/i.test(blob)) return "critical";
      if (/\[?new (mention|reply)|mentioned you|assigned|replied|due today|due date|\?/i.test(blob)) return "high";
      if (/digest|weekly|summary|daily update/i.test(blob)) return "fyi";
      return "normal";
    }
    if (it.source === "email" && (PROMO.test(it.fromAddr || "") || /unsubscribe|% off|deals?\b|sale ends/i.test(blob))) return "fyi";
    if (/🔴|urgent|asap|outage|site (is )?down|not working|broken|critical|immediately/i.test(blob)) return "critical";
    if (/🟡|today|eod|deadline|by tomorrow|please|can you|could you|\?|waiting on|follow.?up/i.test(blob) || it.important) return "high";
    return it.unread ? "normal" : "low";
  }
  function isLow(it, ai, urgency) {
    if (it.waiting) return false;
    if (it.source === "monday" && it.kind === "task") return urgency === "fyi";
    if (it.source !== "email") return false;
    if (urgency === "low" || urgency === "fyi") return true;
    return !!(it.promo || (ai && ai.promotional)) && urgency !== "critical" && urgency !== "high";
  }
  let ITEMS = [], BYKEY = {};
  function buildItems() {
    const ai = S.triage && S.triage.items ? Object.fromEntries(S.triage.items.map((x) => [x.id, x])) : {};
    const raw = [...Object.values(S.mail || {}).flat().map(tagMondayMail), ...(S.slack || []), ...((S.mon && S.mon.tasks) || []), ...((S.mon && S.mon.updates) || [])];
    const seen = new Set();
    ITEMS = raw.filter((i) => i && i.key && !seen.has(i.key) && seen.add(i.key)).map((it) => {
      const a = ai[it.key], q = quick(it), urgency = a && RANK[a.urgency] != null ? a.urgency : q;
      return { ...it, urgency, title: (a && a.title) || it.subject, why: (a && a.why) || "", plan: (a && Array.isArray(a.plan)) ? a.plan.slice(0, 5) : [],
        due: it.due || (a && a.dueDate) || "", low: isLow(it, a, urgency) };
    }).sort((a, b) => (b.waiting ? 1 : 0) - (a.waiting ? 1 : 0) || RANK[a.urgency] - RANK[b.urgency] || b.time - a.time);
    BYKEY = Object.fromEntries(ITEMS.map((i) => [i.key, i]));
  }
  const handled = (key) => !!(S.handled && S.handled[key]);
  const taskFor = (key) => (S.tasks || []).find((t) => t.ref === key && !t.done);
  const inboxOpen = () => ITEMS.filter((i) => !handled(i.key));
  const srcKind = (it) => (it.mondayMail ? "monday" : it.source);
  const SRC_LETTER = { email: "E", slack: "S", monday: "M", task: "✓" };
  const SRC_NAME = { email: "Email", slack: "Slack", monday: "Monday" };
  const where = (it) => it.source === "email" ? (it.mondayMail ? `Monday · ${it.monAcct}` : it.client || "Email")
    : it.source === "slack" ? `Slack · ${it.channel || ""}` : `${it.server || "Monday"} · ${it.board || ""}`;
  const waitDays = (it) => Math.max(1, Math.floor((Date.now() - it.time) / DAY));

  /* ---------- tasks ---------- */
  const openTasks = () => (S.tasks || []).filter((t) => !t.done);
  const todayTasks = () => openTasks().filter((t) => t.day && t.day <= today())
    .sort((a, b) => (b.top - a.top) || a.day.localeCompare(b.day) || a.createdAt - b.createdAt);
  const newId = () => "p:" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);

  async function saveTask(id, patch, quiet) {
    const list = S.tasks || (S.tasks = []);
    let t = list.find((x) => x.id === id);
    if (t) { if ("done" in patch && patch.done !== t.done) t.doneAt = patch.done ? Date.now() : 0; Object.assign(t, patch); }
    else { t = { id, text: "", day: "", top: false, done: false, doneAt: 0, ref: "", note: "", createdAt: Date.now(), ...patch }; list.push(t); }
    if ("done" in patch && t.ref) { if (patch.done) S.handled[t.ref] = Date.now(); else delete S.handled[t.ref]; }
    render();
    try { const r = await api("/api/task", { id, ...patch }); S.tasks = r.tasks; if (!quiet) render(); }
    catch (e) { toast(e.message); }
    return t;
  }
  async function removeTask(id) {
    const old = (S.tasks || []).find((t) => t.id === id); if (!old) return;
    S.tasks = S.tasks.filter((t) => t.id !== id); render();

    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "n" || e.key === "/") { e.preventDefault(); $("addText").focus(); }
    else if (["1", "2", "3", "4"].includes(e.key)) setTab(["today", "inbox", "upcoming", "done"][Number(e.key) - 1]);
  });

  /* ---------- load ---------- */
  async function load() {
    try { S = await api("/api/state"); S.handled ||= {}; S._loadedAt = Date.now(); render(); }
    catch (e) { if (!S) $("view").innerHTML = ""; if (!S) $("view").append(empty("Couldn't load: " + e.message)); }
  }
  if (!["today", "inbox", "upcoming", "done"].includes(tab)) tab = "today";
  $("addDay").value = tab === "upcoming" ? "tomorrow" : "today";
  load();
  setInterval(() => { if (!document.hidden && !$("sheet").classList.contains("open")) load(); }, 5 * 60e3);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && S && Date.now() - (S._loadedAt || 0) > 60e3 && !$("sheet").classList.contains("open")) load(); });
})();
</script>
</body>
</html>
