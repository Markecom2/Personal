<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mark's Command Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: greeting header → focus tiles (they filter) → day-plan strip → split pane: grouped inbox list | detail with plan checklist + inline reply. Phone: list, tap opens detail full-screen. */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --raised:#fbfcfd; --sunk:#eceff3; --line:#dde2e8; --line-strong:#c5ccd6;
  --ink:#121620; --muted:#5d6676; --faint:#8a93a3;
  --accent:#0f766e; --accent-soft:#e1f2ef; --accent-ink:#ffffff;
  --crit:#c8302c; --crit-soft:#fdeceb; --high:#b45d00; --high-soft:#fdf0dc; --norm:#2f5bd3; --norm-soft:#e8eefc; --low:#6b7486; --low-soft:#eef0f3; --ok:#1a7f4b;
  --mail:#d14b2f; --slack:#6c3fc4; --monday:#e2445c;
  --shadow:0 1px 2px rgba(16,22,32,.05),0 4px 16px rgba(16,22,32,.06);
  --display:"Bricolage Grotesque","Figtree",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1016; --surface:#151922; --raised:#1a1f2a; --sunk:#202633; --line:#2a3140; --line-strong:#3a4356;
  --ink:#e9edf4; --muted:#9ba4b6; --faint:#6f788b;
  --accent:#3cc7b5; --accent-soft:#12322f; --accent-ink:#06201d;
  --crit:#ff7a72; --crit-soft:#3a1b1c; --high:#f5b25a; --high-soft:#352712; --norm:#89a5ff; --norm-soft:#1b2546; --low:#9aa3b5; --low-soft:#232937; --ok:#5fd09a;
  --mail:#ff8a6b; --slack:#b394ff; --monday:#ff7b8f; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1016; --surface:#151922; --raised:#1a1f2a; --sunk:#202633; --line:#2a3140; --line-strong:#3a4356;
  --ink:#e9edf4; --muted:#9ba4b6; --faint:#6f788b;
  --accent:#3cc7b5; --accent-soft:#12322f; --accent-ink:#06201d;
  --crit:#ff7a72; --crit-soft:#3a1b1c; --high:#f5b25a; --high-soft:#352712; --norm:#89a5ff; --norm-soft:#1b2546; --low:#9aa3b5; --low-soft:#232937; --ok:#5fd09a;
  --mail:#ff8a6b; --slack:#b394ff; --monday:#ff7b8f; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;display:grid;gap:18px}
button{font:inherit;cursor:pointer;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px;flex:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 24px}
.hello{flex:1 1 380px;min-width:0}
.hello .date{font-size:13px;color:var(--muted);font-weight:500}
.hello h1{font-family:var(--display);font-size:clamp(24px,3.2vw,34px);line-height:1.15;margin:2px 0 4px;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
.hello p{margin:0;color:var(--muted);max-width:68ch;text-wrap:pretty}
.head-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding-right:4px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.pulse.busy{background:var(--high)}
@media (prefers-reduced-motion:no-preference){.pulse.busy{animation:blink 1s ease-in-out infinite}@keyframes blink{50%{opacity:.3}}}

/* sources */
.sources{display:flex;flex-wrap:wrap;gap:8px}
.src{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px;font-size:12px;font-weight:600;max-width:100%}
.src .ic{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}
.src .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.src .dot.warn{background:var(--high)} .src .dot.err{background:var(--crit)}
.src .txt{color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-notes{font-size:12px;color:var(--muted);display:grid;gap:4px;margin:0;padding:0;list-style:none}
.src-notes li::before{content:"• ";color:var(--high)}
.ic.mail{background:var(--mail)} .ic.slack{background:var(--slack)} .ic.monday{background:var(--monday)}

/* focus tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:4px;grid-template-columns:1fr auto;align-items:end}
.tile:hover{border-color:var(--line-strong)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tile .l{grid-column:1/-1;font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:7px}
.tile .l i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tile .n{font-family:var(--display);font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--faint);text-align:right}
.tile.crit .n{color:var(--crit)} .tile.crit .l i{background:var(--crit)}
.tile.high .n{color:var(--high)} .tile.high .l i{background:var(--high)}
.tile.reply .l i{background:var(--norm)} .tile.mon .l i{background:var(--monday)}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile .n{font-size:26px}}

/* day plan */
.plan-strip{display:grid;gap:8px}
.strip-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.strip-h h2{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.strip-h span{font-size:12px;color:var(--faint)}
.blocks{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity}
.block{flex:0 0 min(260px,78vw);scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:3px;align-content:start}
.block.now{border-color:var(--accent);background:var(--accent-soft)}
.block .slot{font-family:var(--mono);font-size:12px;color:var(--muted)}
.block .what{font-weight:650;line-height:1.35}
.block .refs{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* split pane */
.split{display:grid;grid-template-columns:minmax(320px,420px) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-height:640px;overflow:hidden}
.listpane{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;max-height:min(1100px,calc(100vh - 80px))}
.tools{padding:12px;display:grid;gap:10px;border-bottom:1px solid var(--line);background:var(--raised)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 10px}
.search svg{width:16px;height:16px;color:var(--faint);flex:none}
.search input{border:0;background:transparent;font:inherit;color:var(--ink);padding:8px 0;width:100%;min-width:0;outline:none}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:5px 6px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.listscroll{overflow-y:auto;flex:1}
.group-h{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--raised);border:0;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;width:100%;text-align:left}
.group-h .cnt{font-family:var(--mono);font-weight:500;letter-spacing:0;color:var(--faint)}
.group-h .chev{margin-left:auto;transition:transform .15s}
.group-h[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 10px;padding:11px 14px;border-bottom:1px solid var(--line);width:100%;position:relative}
.row:hover{background:var(--raised)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row[aria-selected="true"]{background:var(--accent-soft)}
.row[aria-selected="true"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.row .ic{grid-row:span 2;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px}
.row .t{font-weight:600;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.row.unread .t::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--norm);margin-left:6px;vertical-align:middle}
.row .when{font-size:12px;color:var(--faint);font-family:var(--mono);white-space:nowrap}
.row .when.late{color:var(--crit);font-weight:500}
.row .sub{grid-column:2/-1;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.done{opacity:.55}.row.done .t{text-decoration:line-through}
.sevbar{display:inline-block;width:8px;height:8px;border-radius:50%}
.sevbar.critical{background:var(--crit)}.sevbar.high{background:var(--high)}
.list-empty{padding:40px 20px;text-align:center;color:var(--muted)}
.list-empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.list-foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);background:var(--raised)}
.list-foot label{display:flex;gap:6px;align-items:center;cursor:pointer}

/* detail */
.detail{min-width:0;display:flex;flex-direction:column;max-height:min(1100px,calc(100vh - 80px))}
.detail-scroll{overflow-y:auto;flex:1;padding:22px 26px;display:grid;gap:20px;align-content:start}
.back{display:none;justify-self:start}
.d-top{display:grid;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.critical{background:var(--crit-soft);color:var(--crit)}.chip.high{background:var(--high-soft);color:var(--high)}.chip.normal{background:var(--norm-soft);color:var(--norm)}
.d-top h2{margin:0;font-family:var(--display);font-size:clamp(20px,2.2vw,26px);line-height:1.2;letter-spacing:-.015em;text-wrap:balance;overflow-wrap:anywhere}
.d-meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;overflow-wrap:anywhere}
.d-meta a{color:var(--accent);font-weight:600;text-decoration:none}
.d-meta a:hover{text-decoration:underline}
.why{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow-wrap:anywhere}
.why b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.sec-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
.sec-title span{text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.steps label{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;padding:9px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.steps label:hover{border-color:var(--line-strong)}
.steps input{margin:2px 0 0;width:16px;height:16px;accent-color:var(--accent)}
.steps input:checked + span{text-decoration:line-through;color:var(--faint)}
.no-plan{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:12px}
details.orig{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.orig summary{cursor:pointer;padding:10px 14px;font-size:13px;font-weight:600;color:var(--muted);list-style:none;display:flex;justify-content:space-between}
details.orig summary::-webkit-details-marker{display:none}
details.orig summary::after{content:"Show";color:var(--accent)}
details.orig[open] summary::after{content:"Hide"}
details.orig .body{padding:0 14px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.6;max-height:360px;overflow-y:auto}

/* composer */
.composer{border-top:1px solid var(--line);background:var(--raised);padding:14px 26px calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.composer .to{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.composer .to b{color:var(--ink);font-weight:600}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;font:inherit;border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:var(--surface);color:var(--ink)}
.ask input:focus,.composer textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.composer textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:110px;resize:vertical;background:var(--surface);color:var(--ink);width:100%}
.send-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.send-row .status{flex:1;min-width:160px;font-size:13px;color:var(--muted)}
.status.err{color:var(--crit)}.status.ok{color:var(--ok)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.confirm span{flex:1 1 220px;font-size:13px;font-weight:600}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);background:var(--surface)}
.d-empty{display:grid;place-items:center;text-align:center;color:var(--muted);padding:60px 20px;height:100%}
.d-empty b{display:block;color:var(--ink);font-family:var(--display);font-size:20px;margin-bottom:6px}
.hint{font-size:12px;color:var(--faint);display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:12px}

.banner{border:1px solid var(--line);background:var(--high-soft);border-radius:12px;padding:10px 14px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:30;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}

@media (max-width:900px){
  .split{grid-template-columns:minmax(0,1fr);min-height:0}
  .listpane{border-right:0;max-height:none}
  .detail{display:none;max-height:none}
  .split.show-detail .listpane{display:none}
  .split.show-detail .detail{display:flex}
  .back{display:inline-flex}
  .detail-scroll{padding:16px}
  .composer{padding-left:16px;padding-right:16px}
  .hint{display:none}
}
</style>
</head><body>
<div class="wrap">
  <header class="head">
    <div class="hello">
      <div class="date" id="today"></div>
      <h1 id="headline">Getting your day ready…</h1>
      <p id="subline">Pulling Zoho Mail, Slack and Monday.com.</p>
    </div>
    <div class="head-actions">
      <span class="sync"><span class="pulse busy" id="pulse"></span><span id="syncTxt">Syncing…</span></span>
      <button class="btn" id="refresh" type="button" title="Fetch new messages now">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Refresh</button>
      <button class="btn primary" id="retriage" type="button" title="Ask Claude to re-rank everything and rewrite the plans">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg><span>Re-plan my day</span></button>
      <form method="post" action="/logout" style="margin:0"><button class="btn ghost" type="submit">Sign out</button></form>
    </div>
  </header>

  <div class="sources" id="sources" aria-label="Connected sources"></div>
  <ul class="src-notes" id="srcNotes" hidden></ul>
  <div class="banner" id="pageBanner" hidden></div>

  <section class="tiles" aria-label="Focus filters">
    <button class="tile crit" type="button" data-tile="critical" aria-pressed="false"><span class="l"><i></i>Do now</span><span class="n" id="kCrit">0</span><span class="s">critical</span></button>
    <button class="tile high" type="button" data-tile="high" aria-pressed="false"><span class="l"><i></i>Today</span><span class="n" id="kHigh">0</span><span class="s">high priority</span></button>
    <button class="tile reply" type="button" data-tile="reply" aria-pressed="false"><span class="l"><i></i>Waiting on your reply</span><span class="n" id="kReply">0</span><span class="s">threads</span></button>
    <button class="tile mon" type="button" data-tile="overdue" aria-pressed="false"><span class="l"><i></i>Overdue on Monday</span><span class="n" id="kMon">0</span><span class="s">tasks</span></button>
  </section>

  <section class="plan-strip" aria-labelledby="planH">
    <div class="strip-h"><h2 id="planH">Your day</h2><span id="planMeta"></span></div>
    <div class="blocks" id="blocks"></div>
  </section>

  <section class="split" id="split" aria-label="Inbox">
    <div class="listpane">
      <div class="tools">
        <label class="search" for="q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span class="visually-hidden">Search</span><input id="q" type="search" placeholder="Search people, clients, subjects…" autocomplete="off"></label>
        <div class="seg" role="group" aria-label="Source">
          <button type="button" data-src="all" aria-pressed="true">All</button>
          <button type="button" data-src="email" aria-pressed="false">Email</button>
          <button type="button" data-src="slack" aria-pressed="false">Slack</button>
          <button type="button" data-src="monday" aria-pressed="false">Monday</button>
        </div>
      </div>
      <div class="listscroll" id="list" role="listbox" aria-label="Items"></div>
      <div class="list-foot"><span id="listCount"></span><label for="showDone"><input type="checkbox" id="showDone"> Show handled</label></div>
    </div>
    <div class="detail" id="detail"></div>
  </section>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(() => {
  const HOUR = 3600000;
  const $ = (id) => document.getElementById(id);
  const S = {
    mcp: null, sample: null, accounts: [], mail: {}, slack: [], mailErr: {}, slackErr: null, mailAt: 0, slackAt: 0,
    mon: { boards: [], tasks: {}, updates: {}, err: {}, ctx: {}, at: 0 },
    triage: null, triageAt: 0, planning: false,
    src: "all", tile: null, q: "", showDone: false, selected: null, collapsed: { fyi: true, later: true },
    example: false, loading: true, sending: false, draftCtl: null, confirmFor: null
  };
  const RANK = { critical: 0, high: 1, normal: 2, low: 3, fyi: 4 };
  const LABEL = { critical: "Critical", high: "High", normal: "Normal", low: "Low", fyi: "FYI" };
  const GROUPS = [
    { id: "now", title: "Do now", match: (u) => u === "critical" },
    { id: "today", title: "Today", match: (u) => u === "high" },
    { id: "week", title: "This week", match: (u) => u === "normal" },
    { id: "later", title: "Later", match: (u) => u === "low" },
    { id: "fyi", title: "FYI & newsletters", match: (u) => u === "fyi" }
  ];
  const EMOJI = { ":red_circle:": "🔴", ":large_yellow_circle:": "🟡", ":large_green_circle:": "🟢", ":new:": "🆕", ":white_check_mark:": "✅", ":warning:": "⚠️", ":fire:": "🔥" };
  const SRC = { email: { cls: "mail", letter: "Z" }, slack: { cls: "slack", letter: "S" }, monday: { cls: "monday", letter: "M" } };

  /* ---------- per-viewer memory (handled items, ticked steps) ---------- */
  const store = {
    get(k, d) { try { const v = localStorage.getItem("cd:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem("cd:" + k, JSON.stringify(v)); } catch {} }
  };
  let handled = store.get("handled", {}), ticks = store.get("ticks", {});
  const isDone = (k) => !!handled[k];
  function setDone(k, v) { if (v) handled[k] = Date.now(); else delete handled[k];
    const cut = Date.now() - 14 * 24 * HOUR; for (const x in handled) if (handled[x] < cut) delete handled[x]; store.set("handled", handled); api("/api/mark", { key: k, done: !!v }).catch(() => {}); }

  /* ---------- helpers ---------- */
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const fmtTime = (ms) => { if (!ms) return "—"; const d = new Date(ms), now = new Date();
    if (now.toDateString() === d.toDateString()) return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    if (new Date(now - 864e5).toDateString() === d.toDateString()) return "Yesterday";
    return d.toLocaleDateString([], { month: "short", day: "numeric" }); };
  const ago = (ms) => { const m = Math.round((Date.now() - ms) / 60000); return m < 1 ? "just now" : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`; };
  const emo = (s) => String(s || "").replace(/:[a-z_]+:/g, (m) => EMOJI[m] || "");
  const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  const dig = (o, ...keys) => keys.reduce((a, k) => (a && a[k] != null ? a[k] : undefined), o);
  const ent = (s) => String(s || "").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">");
  const strip = (s) => String(s || "").replace(/ /g, " ").replace(/\n{3,}/g, "\n\n").trim();
  const toast = (msg) => { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 3200); };
  const wide = () => window.matchMedia("(min-width: 901px)").matches;

  function errCopy(e, server) {
    switch (e && e.code) {
      case "needs_reauth": return `${server} needs reconnecting: claude.ai Settings → Connectors.`;
      case "server_not_connected": return `${server} isn't connected. Add it in claude.ai Settings → Connectors.`;
      case "selection_required": return `More than one ${server} connector. Pick one in the prompt claude.ai shows.`;
      case "not_in_manifest": case "approval_required": return `${server} isn't allowed for this page yet. Allow it from the artifact's Permissions menu.`;
      case "blocked_by_policy": return `Your organization blocks this ${server} action.`;
      case "server_unavailable": return `${server} didn't answer. Showing the last data; it retries on the next refresh.`;
      case "tool_error": return `${server} reported an error: ${String(e.message || "").slice(0, 140)}`;
      default: return `${server} couldn't be reached (${(e && e.code) || "unknown"}).`;
    }
  }
  const AUTHZ = ["needs_reauth", "server_not_connected", "not_in_manifest", "blocked_by_policy", "approval_required"];

  /* ---------- parsing ---------- */
  function parseAccounts(payload) {
    const d = dig(payload, "data", "data") || dig(payload, "data") || payload, out = [];
    const push = (a) => a && a.accountId && out.push({ id: String(a.accountId), email: a.emailAddress || a.primaryEmailAddress || a.mailboxAddress || "Zoho account" });
    if (Array.isArray(d)) d.forEach(push); else if (d) { push(d.primaryAccount); Object.values(d).forEach((v) => Array.isArray(v) && v.forEach(push)); }
    const seen = new Set(); return out.filter((a) => !seen.has(a.id) && seen.add(a.id));
  }
  function parseMails(payload, acct) {
    const msgs = dig(payload, "data", "data", "messages") || dig(payload, "data", "messages") || dig(payload, "data", "data") || [];
    return (Array.isArray(msgs) ? msgs : []).map((m) => ({
      key: "e:" + m.messageId, source: "email", account: acct, msgId: String(m.messageId),
      from: ent(m.sender || m.fromAddress || ""), fromAddr: m.fromAddress || "", subject: ent(m.subject) || "(no subject)",
      preview: String(m.summary || "").replace(/\s+/g, " ").trim(), time: Number(m.receivedTime) || 0,
      unread: String(m.status) === "0", important: String(m.priority) === "1" || String(m.priority) === "2"
    })).map(tagMondayMail);
  }
  const MON_EMAIL_ACCTS = [
    { re: /mood\s*creative|moodcreative|alana cocking/i, label: "Mood Creative", url: "https://moodcreative-company.monday.com" },
    { re: /great[\s-]*escape|great-escape-gang|greatescapeau|\btge\b/i, label: "The Great Escape", url: "https://the-great-escape-gang.monday.com" }
  ];
  function tagMondayMail(m) {
    if (/@moodcreative\.com\.au$/i.test(m.fromAddr.trim())) return { ...m, client: "Mood Creative" };
    if (/@greatescapeau\.com$/i.test(m.fromAddr.trim())) return { ...m, client: "The Great Escape" };
    if (!/^notifications@monday\.com$/i.test(m.fromAddr.trim())) return m;
    const blob = `${m.from} ${m.subject} ${m.preview}`;
    const acct = MON_EMAIL_ACCTS.find((a) => a.re.test(blob));
    const who = String(m.from).replace(/\s+via monday\.com$/i, "");
    const kind = (m.subject.match(/^\[([^\]]+)\]/) || [])[1] || "Update";
    const subject = m.subject.replace(/^\[[^\]]+\]\s*/, "").replace(/&quot;/g, "\"").replace(/&#39;/g, "'");
    return { ...m, mondayMail: true, from: who, monKind: kind, subject: `${kind}: ${subject}`, monAcct: acct ? acct.label : "Monday (other account)", link: acct ? acct.url : "", client: acct ? acct.label : "" };
  }
  function parseSlack(payload) {
    const md = typeof payload === "string" ? payload : (payload && payload.results) || "";
    return String(md).split(/### Result \d+ of \d+/).slice(1).map((p) => {
      const g = (re) => { const m = p.match(re); return m ? m[1].trim() : ""; };
      const permalink = g(/Permalink:\s*\[link\]\(([^)\s]+)\)/).replace(/\\\//g, "/");
      const ts = g(/Message_ts:\s*([\d.]+)/);
      const text = ((p.split(/\nText:\s*\n?/)[1] || "").split(/\n---/)[0] || "").trim();
      const chanLine = g(/Channel:\s*(.+)/);
      return {
        key: "s:" + ts, source: "slack", channelId: g(/Channel:.*?\(ID:\s*([A-Z0-9]+)\)/), channel: chanLine.replace(/\s*\(ID:.*$/, "").replace(/^#/, ""),
        from: g(/From:\s*(.+)/).replace(/\s*<.*$/, "").replace(/\s*\(ID.*$/, ""), ts,
        threadTs: (permalink.match(/thread_ts=([\d.]+)/) || [])[1] || ts, link: permalink,
        subject: emo(text.split("\n")[0]).slice(0, 140) || "(message)", preview: emo(text).replace(/<(https?:[^>|]+)[^>]*>/g, "$1").trim(),
        time: Math.round(parseFloat(ts) * 1000) || 0, unread: false
      };
    }).filter((m) => m.ts);
  }
  function parseTasks(payload, board) {
    return ((payload && payload.items) || []).map((it) => {
      const cv = it.column_values || {};
      const pick = (re) => { const k = Object.keys(cv).find((k) => re.test(k)); return k ? String(cv[k] || "") : ""; };
      const status = cv.status != null ? String(cv.status) : pick(/status/i);
      const due = String(cv.date4 || pick(/^date/i) || "").slice(0, 10);
      const people = String(cv.person || cv.people || pick(/person|people|owner/i) || "");
      const client = String(cv.color_mkwg7t3e || pick(/client/i) || "");
      const group = (it.group && it.group.title) || "";
      return { key: "t:" + it.id, source: "monday", kind: "task", server: board.server, itemId: Number(it.id), board: board.label || board.name, link: it.url || "",
        from: people || "Unassigned", subject: it.name || "(untitled item)", status, due, client, group,
        preview: [status && "Status: " + status, due && "Due " + due, client && "Client: " + client, people && "Assigned: " + people, group && "Group: " + group].filter(Boolean).join("\n"),
        time: Date.parse(it.updated_at) || 0, unread: false };
    }).filter((t) => !/^done$/i.test(t.status) && !/complete/i.test(t.group));
  }
  function parseUpdates(payload, board) {
    const cutoff = Date.now() - 3 * 24 * HOUR;
    return ((payload && payload.updates) || []).map((u) => {
      const reps = Array.isArray(u.replies) ? u.replies : [];
      const last = reps.length ? reps[reps.length - 1] : u;
      const t = Date.parse(last.created_at || u.updated_at || u.created_at) || 0;
      const thread = [`${(u.creator && u.creator.name) || "Someone"}: ${strip(u.text_body)}`].concat(reps.map((r) => `${(r.creator && r.creator.name) || "Someone"}: ${strip(r.text_body)}`));
      const firstLine = strip(last.text_body).split("\n").find((l) => l.trim()) || "(update)";
      return { key: "u:" + u.id, source: "monday", kind: "update", server: board.server, updateId: Number(u.id), itemId: Number(u.item_id), board: board.label || board.name,
        link: u.item_id && board.url ? `${board.url}/pulses/${u.item_id}` : board.url || "",
        from: (last.creator && last.creator.name) || "", starter: (u.creator && u.creator.name) || "",
        subject: firstLine.slice(0, 140), preview: thread.join("\n\n").slice(0, 3000), time: t, unread: false, replies: reps.length };
    }).filter((u) => u.time >= cutoff);
  }

  /* ---------- quick urgency (keywords) ---------- */
  const PROMO = /no-?reply|newsletter|marketing|promo|notifications?@|email@email|mailer|digest/i;
  function quick(it) {
    if (it.source === "monday" && it.kind === "task") {
      const today = todayStr(), overdue = it.due && it.due < today, stuck = /stuck|changes required/i.test(it.status);
      if (/de-prioriti/i.test(it.status)) return "fyi";
      if (stuck && (overdue || it.due === today)) return "critical";
      if (overdue || it.due === today || stuck || /ready for review/i.test(it.status)) return "high";
      if (/waiting|sent to client|approved/i.test(it.status)) return "low";
      return "normal";
    }
    const blob = `${it.subject} ${it.preview}`;
    if (it.mondayMail) {
      if (/overdue|stuck|urgent|asap|changes required/i.test(blob)) return "critical";
      if (/\[?new (mention|reply)|mentioned you|assigned|replied|due today|due date|\?/i.test(blob)) return "high";
      if (/digest|weekly|summary|daily update/i.test(blob)) return "fyi";
      return "normal";
    }
    if (it.source === "email" && (PROMO.test(it.fromAddr) || /unsubscribe|% off|deals?\b|sale ends/i.test(blob))) return "fyi";
    if (/🔴|urgent|asap|outage|site (is )?down|not working|broken|critical|immediately/i.test(blob)) return "critical";
    if (/🟡|today|eod|deadline|by tomorrow|please|can you|could you|\?|waiting on|follow.?up/i.test(blob) || it.important) return "high";
    return it.unread ? "normal" : "low";
  }

  function allItems() {
    return [...Object.values(S.mail).flat(), ...S.slack, ...Object.values(S.mon.tasks).flat(), ...Object.values(S.mon.updates).flat()].sort((a, b) => b.time - a.time);
  }
  function merged() {
    const t = S.triage && S.triage.items ? Object.fromEntries(S.triage.items.map((x) => [x.id, x])) : {};
    return allItems().map((it) => {
      const ai = t[it.key], q = quick(it);
      return ai ? { ...it, urgency: RANK[ai.urgency] != null ? ai.urgency : q, title: ai.title || it.subject, why: ai.why || "", plan: Array.isArray(ai.plan) ? ai.plan.slice(0, 5) : [], client: ai.client || it.client || "", replyNeeded: !!ai.replyNeeded, ai: true }
        : { ...it, urgency: q, title: it.subject, why: "", plan: [], client: it.client || "", replyNeeded: (q === "critical" || q === "high") && it.kind !== "task", ai: false };
    }).sort((a, b) => RANK[a.urgency] - RANK[b.urgency] || b.time - a.time);
  }
  function visible(items) {
    const q = S.q.trim().toLowerCase();
    return items.filter((i) => {
      if (!S.showDone && isDone(i.key)) return false;
      if (S.src !== "all" && (i.mondayMail ? "monday" : i.source) !== S.src) return false;
      if (S.tile === "critical" && i.urgency !== "critical") return false;
      if (S.tile === "high" && i.urgency !== "high") return false;
      if (S.tile === "reply" && !i.replyNeeded) return false;
      if (S.tile === "overdue" && !(i.kind === "task" && i.due && i.due < todayStr())) return false;
      if (q && !`${i.title} ${i.subject} ${i.from} ${i.client} ${i.board || ""} ${i.channel || ""} ${i.preview}`.toLowerCase().includes(q)) return false;
      return true;
    });
  }
  const isCollapsed = (gid) => !!S.collapsed[gid] && !S.q && !S.tile;
  const navOrder = () => { const vis = visible(ITEMS); return GROUPS.flatMap((g) => isCollapsed(g.id) ? [] : vis.filter((i) => g.match(i.urgency))); };

  /* ---------- render ---------- */
  let ITEMS = [];
  function render() {
    ITEMS = merged();
    const open = ITEMS.filter((i) => !isDone(i.key));
    const n = (f) => open.filter(f).length;
    $("kCrit").textContent = n((i) => i.urgency === "critical");
    $("kHigh").textContent = n((i) => i.urgency === "high");
    $("kReply").textContent = n((i) => i.replyNeeded);
    $("kMon").textContent = n((i) => i.kind === "task" && i.due && i.due < todayStr());
    document.querySelectorAll(".tile").forEach((t) => t.setAttribute("aria-pressed", String(S.tile === t.dataset.tile)));
    renderHeader(); renderSources(); renderBlocks(); renderList(); renderDetail();
  }

  function renderHeader() {
    const open = ITEMS.filter((i) => !isDone(i.key));
    const h = new Date().getHours();
    $("today").textContent = new Date().toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });
    const c = open.filter((i) => i.urgency === "critical").length, hi = open.filter((i) => i.urgency === "high").length;
    const greet = h < 12 ? "Good morning, Mark." : h < 17 ? "Good afternoon, Mark." : "Good evening, Mark.";
    if (S.loading && !open.length) { $("headline").textContent = greet; $("subline").textContent = "Pulling Zoho Mail, Slack and Monday.com…"; }
    else {
      $("headline").textContent = c ? `${greet} ${c} thing${c > 1 ? "s" : ""} need${c > 1 ? "" : "s"} you now.` : hi ? `${greet} ${hi} item${hi > 1 ? "s" : ""} for today, nothing on fire.` : `${greet} You're clear.`;
      $("subline").textContent = S.triage && S.triage.headline ? S.triage.headline : S.example ? "These are example items. Open the page on claude.ai to see your own." : S.planning ? "Claude is ranking everything and writing your plans…" : "Ranked by keywords for now. Press Re-plan my day for Claude's priorities and step-by-step plans.";
    }
    const last = Math.max(S.mailAt, S.slackAt, S.mon.at);
    $("pulse").className = "pulse" + (S.loading || S.planning ? " busy" : "");
    $("syncTxt").textContent = S.planning ? "Claude is planning…" : last ? `Synced ${ago(last)} · next in ${Math.max(0, Math.round((last + (S.refreshMin || 60) * 60000 - Date.now()) / 60000))} min` : "Syncing…";
  }

  function renderSources() {
    const box = $("sources"); box.replaceChildren(); const notes = [];
    for (const s of S.serverSources || []) {
      const p = el("span", "src"); if (s.title) p.title = s.title;
      const k = SRC[s.icon] ? s.icon : "email";
      const ic = el("span", "ic " + SRC[k].cls, SRC[k].letter); ic.setAttribute("aria-hidden", "true");
      p.append(ic, el("span", null, s.label), el("span", "dot " + s.state), el("span", "txt", s.txt)); box.append(p);
      if (s.note) notes.push(`${s.label}: ${s.note}`);
    }
    if (!(S.serverSources || []).length) { const p = el("span", "src"); p.append(el("span", "txt", S.loading ? "Connecting to your accounts…" : "No sources set up yet")); box.append(p); }
    const ul = $("srcNotes"); ul.replaceChildren(...notes.map((t) => el("li", null, t))); ul.hidden = !notes.length;
  }

  function renderBlocks() {
    const box = $("blocks"); box.replaceChildren();
    const byKey = Object.fromEntries(ITEMS.map((i) => [i.key, i]));
    let plan = S.triage && Array.isArray(S.triage.dayPlan) && S.triage.dayPlan.length ? S.triage.dayPlan : null;
    if (!plan) {
      const open = ITEMS.filter((i) => !isDone(i.key));
      plan = [
        { slot: "Now", focus: "Clear the Do now list", ids: open.filter((i) => i.urgency === "critical").slice(0, 4).map((i) => i.key) },
        { slot: "Next 2 hours", focus: "Reply to people waiting on you", ids: open.filter((i) => i.replyNeeded && i.urgency === "high").slice(0, 4).map((i) => i.key) },
        { slot: "Afternoon", focus: "Review Monday tasks and unblock the team", ids: open.filter((i) => i.kind === "task" && (i.urgency === "high" || i.urgency === "critical")).slice(0, 4).map((i) => i.key) },
        { slot: "End of day", focus: "Skim FYI, plan tomorrow", ids: [] }
      ];
      $("planMeta").textContent = S.example ? "Example" : "Suggested. Re-plan for Claude's timed plan.";
    } else $("planMeta").textContent = `Planned by Claude at ${fmtTime(S.triageAt)}`;
    plan.forEach((p, idx) => {
      const b = el("div", "block" + (idx === 0 ? " now" : ""));
      b.append(el("span", "slot", p.slot || ""), el("span", "what", p.focus || ""));
      const refs = (p.ids || []).map((k) => byKey[k] && byKey[k].title).filter(Boolean);
      if (refs.length) b.append(el("span", "refs", refs.join(" · ")));
      box.append(b);
    });
  }

  function renderList() {
    const list = $("list"); list.replaceChildren();
    const vis = visible(ITEMS);
    $("listCount").textContent = `${vis.length} item${vis.length === 1 ? "" : "s"}${S.tile || S.src !== "all" || S.q ? " · filtered" : ""}`;
    if (S.selected && !ITEMS.some((i) => i.key === S.selected)) S.selected = null;
    if (!S.selected && wide()) { const first = navOrder()[0]; if (first) S.selected = first.key; }
    if (!vis.length) {
      const e = el("div", "list-empty"), filtered = S.tile || S.q || S.src !== "all";
      e.append(el("b", null, S.loading ? "Loading your inbox…" : filtered ? "Nothing matches" : "Inbox zero"),
        document.createTextNode(S.loading ? "Mail, Slack and Monday arrive in a few seconds." : filtered ? "Clear the search or filters to see everything." : "Nothing is waiting on you."));
      list.append(e); return;
    }
    for (const g of GROUPS) {
      const rows = vis.filter((i) => g.match(i.urgency));
      if (!rows.length) continue;
      const collapsed = isCollapsed(g.id);
      const h = el("button", "group-h"); h.type = "button"; h.setAttribute("aria-expanded", String(!collapsed));
      if (g.id === "now" || g.id === "today") h.append(el("span", "sevbar " + (g.id === "now" ? "critical" : "high")));
      h.append(document.createTextNode(g.title + " "), el("span", "cnt", String(rows.length)));
      const chev = el("span", "chev", "▾"); chev.setAttribute("aria-hidden", "true"); h.append(chev);
      h.onclick = () => { S.collapsed[g.id] = !collapsed; renderList(); };
      list.append(h);
      if (collapsed) continue;
      for (const it of rows) {
        const r = el("button", "row" + (it.unread ? " unread" : "") + (isDone(it.key) ? " done" : ""));
        r.type = "button"; r.setAttribute("role", "option"); r.dataset.key = it.key; r.setAttribute("aria-selected", String(it.key === S.selected));
        const ic = el("span", "ic " + SRC[it.mondayMail ? "monday" : it.source].cls, SRC[it.mondayMail ? "monday" : it.source].letter); ic.setAttribute("aria-hidden", "true");
        const sub = it.mondayMail ? `${it.monAcct} · ${it.from} · via email` : it.source === "email" ? it.from : it.source === "slack" ? `#${it.channel} · ${it.from}` : it.kind === "task" ? [it.client, it.status].filter(Boolean).join(" · ") : `${it.board} · ${it.from}`;
        let when = fmtTime(it.time), late = false;
        if (it.kind === "task" && it.due) { late = it.due < todayStr(); when = late ? "overdue" : it.due === todayStr() ? "due today" : "due " + new Date(it.due + "T00:00").toLocaleDateString([], { day: "numeric", month: "short" }); }
        r.append(ic, el("span", "t", it.title), el("span", "when" + (late ? " late" : ""), when), el("span", "sub", sub));
        r.onclick = () => select(it.key, true);
        list.append(r);
      }
    }
  }

  function select(key, fromClick) {
    if (S.selected !== key) S.confirmFor = null;
    S.selected = key;
    document.querySelectorAll(".row").forEach((r) => r.setAttribute("aria-selected", String(r.dataset.key === key)));
    renderDetail();
    if (fromClick && !wide()) { $("split").classList.add("show-detail"); $("split").scrollIntoView({ block: "start" }); }
  }

  function renderDetail() {
    const box = $("detail");
    const it = ITEMS.find((i) => i.key === S.selected);
    const same = box.dataset.key === S.selected;
    const keepText = same && $("dText") ? $("dText").value : null, keepAsk = same && $("dAsk") ? $("dAsk").value : null;
    const focusId = same && document.activeElement && ["dText", "dAsk"].includes(document.activeElement.id) ? document.activeElement.id : null;
    box.replaceChildren(); box.dataset.key = it ? it.key : "";
    if (!it) {
      const e = el("div", "d-empty"), inner = el("div");
      inner.append(el("b", null, S.loading ? "Loading…" : "Pick an item"), document.createTextNode("Its plan and a reply box open here."));
      const hint = el("div", "hint");
      [["J", " / ", "K", " move"], ["R", " reply"], ["E", " mark handled"], ["/", " search"]].forEach((parts) => { const s = el("span"); parts.forEach((p, i) => s.append(i % 2 === 0 ? el("span", "kbd", p) : document.createTextNode(p))); hint.append(s); });
      inner.append(hint); e.append(inner); box.append(e); return;
    }
    const sc = el("div", "detail-scroll");
    const back = el("button", "btn ghost back", "← All items"); back.type = "button"; back.onclick = () => $("split").classList.remove("show-detail"); sc.append(back);

    const top = el("div", "d-top"), chips = el("div", "chips");
    chips.append(el("span", "chip " + it.urgency, LABEL[it.urgency]));
    chips.append(el("span", "chip", it.mondayMail ? "Monday notification (email)" : it.source === "email" ? "Email" : it.source === "slack" ? "Slack" : it.kind === "task" ? "Monday task" : "Monday discussion"));
    if (it.client) chips.append(el("span", "chip", it.client));
    if (it.kind === "task" && it.status) chips.append(el("span", "chip", it.status));
    if (isDone(it.key)) chips.append(el("span", "chip", "Handled"));
    top.append(chips, el("h2", null, it.title));
    const meta = el("div", "d-meta");
    if (it.source === "email") meta.append(el("span", null, `From ${it.from}${it.fromAddr && it.fromAddr !== it.from ? " · " + it.fromAddr : ""}`), el("span", null, `To ${it.account ? it.account.email : ""}`));
    else if (it.source === "slack") meta.append(el("span", null, `${it.from} in #${it.channel}`));
    else meta.append(el("span", null, it.kind === "task" ? `Assigned to ${it.from}` : `Latest from ${it.from}`), el("span", null, it.board));
    if (it.kind === "task" && it.due) meta.append(el("span", null, `Due ${new Date(it.due + "T00:00").toLocaleDateString([], { day: "numeric", month: "short" })}${it.due < todayStr() ? " (overdue)" : ""}`));
    meta.append(el("span", null, fmtTime(it.time)));
    if (it.link) { const a = el("a", null, it.mondayMail ? `Open ${it.monAcct} in Monday ↗` : it.source === "monday" ? "Open in Monday ↗" : "Open in Slack ↗"); a.href = it.link; a.target = "_blank"; a.rel = "noopener"; meta.append(a); }
    top.append(meta); sc.append(top);

    if (it.why) { const w = el("div", "why"); w.append(el("b", null, "Why it matters"), document.createTextNode(it.why)); sc.append(w); }

    const planSec = el("section"), pt = el("h3", "sec-title");
    pt.append(document.createTextNode("Plan"), el("span", null, it.ai ? "by Claude · tick steps as you go" : ""));
    planSec.append(pt);
    if (it.plan.length) {
      const ul = el("ul", "steps"), done = ticks[it.key] || [];
      it.plan.forEach((s, i) => {
        const li = el("li"), lab = el("label"), cb = el("input"); cb.type = "checkbox"; cb.id = `step-${i}`; cb.checked = done.includes(i);
        cb.onchange = () => { const d = new Set(ticks[it.key] || []); cb.checked ? d.add(i) : d.delete(i); ticks[it.key] = [...d]; store.set("ticks", ticks); api("/api/ticks", { key: it.key, steps: [...d] }).catch(() => {});
          if (d.size === it.plan.length && !isDone(it.key)) { setDone(it.key, true); toast("All steps done. Marked as handled."); render(); } };
        lab.htmlFor = cb.id; lab.append(cb, el("span", null, s)); li.append(lab); ul.append(li);
      });
      planSec.append(ul);
    } else planSec.append(el("div", "no-plan", S.sample ? (S.planning ? "Claude is writing the plan…" : "No plan yet. Press Re-plan my day and Claude will write the steps.") : "Plans need Claude, which isn't available in this view."));
    sc.append(planSec);

    const det = el("details", "orig"); det.open = !it.plan.length;
    det.append(el("summary", null, it.kind === "update" ? `Discussion · ${(it.replies || 0) + 1} message${it.replies ? "s" : ""}` : it.kind === "task" ? "Task details" : "Original message"));
    det.append(el("div", "body", it.source === "email" ? `${it.subject}\n\n${it.preview || "(no preview)"}` : it.preview || it.subject));
    sc.append(det);

    const actions = el("div", "chips");
    const doneBtn = el("button", "btn", isDone(it.key) ? "Mark as not handled" : "✓ Mark as handled"); doneBtn.type = "button"; doneBtn.title = "Shortcut: E";
    doneBtn.onclick = () => toggleDone(it); actions.append(doneBtn); sc.append(actions);
    box.append(sc);

    /* composer */
    const comp = el("div", "composer"), to = el("div", "to"), toL = el("span");
    toL.append(document.createTextNode(it.source === "email" ? "Reply to " : it.source === "slack" ? "Reply in thread · #" : it.kind === "update" ? "Reply in Monday thread · " : "Post an update on this task · "),
      el("b", null, it.source === "email" ? (it.fromAddr || it.from) : it.source === "slack" ? it.channel : it.board));
    to.append(toL, el("span", null, it.mondayMail ? "Replying here emails Monday's notification address. To answer in the thread, use Open in Monday." : "Ctrl/⌘ + Enter to send"));
    comp.append(to);
    if (S.sample) {
      const ask = el("div", "ask"), ai = el("input"); ai.id = "dAsk"; ai.type = "text"; ai.placeholder = "Tell Claude what to say, e.g. “confirm we'll fix it by 3pm”"; ai.setAttribute("aria-label", "Instruction for Claude");
      const db = el("button", "btn", "✦ Draft"); db.type = "button"; db.id = "dDraft"; db.title = "Draft a reply with Claude";
      db.onclick = () => draft(it); ai.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); draft(it); } };
      if (keepAsk != null) ai.value = keepAsk;
      ask.append(ai, db); comp.append(ask);
    }
    const ta = el("textarea"); ta.id = "dText"; ta.placeholder = it.source === "email" ? "Write your email reply…" : "Write your reply…"; ta.setAttribute("aria-label", "Reply text");
    if (keepText != null) ta.value = keepText;
    ta.onkeydown = (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); askSend(it); } };
    comp.append(ta);
    const row = el("div", "send-row"), st = el("span", "status"); st.id = "dStatus"; st.setAttribute("role", "status");
    const sb = el("button", "btn primary", it.source === "email" ? "Send email" : it.source === "slack" ? "Send to Slack" : "Post to Monday"); sb.type = "button"; sb.id = "dSend"; sb.disabled = S.example || !S.mcp;
    sb.onclick = () => askSend(it);
    row.append(st, sb); comp.append(row);
    if (S.example) st.textContent = "Sending works when this page is open on claude.ai.";
    if (S.confirmFor === it.key) comp.append(confirmBox(it, false));
    box.append(comp);
    if (focusId && $(focusId)) $(focusId).focus();
  }

  function confirmBox(it, focus) {
    const c = el("div", "confirm"); c.id = "dConfirm";
    c.append(el("span", null, it.source === "email" ? `Send this from ${it.account ? it.account.email : "Zoho"} to ${it.fromAddr || it.from}?` : it.source === "slack" ? `Post this in the #${it.channel} thread?` : it.kind === "update" ? "Post this reply in the Monday thread?" : `Post this as an update on “${it.subject}”?`));
    const y = el("button", "btn primary", "Yes, send"); y.type = "button"; y.id = "dYes"; y.onclick = () => send(it);
    const n = el("button", "btn", "Cancel"); n.type = "button"; n.onclick = () => { S.confirmFor = null; c.remove(); };
    c.append(y, n); if (focus) setTimeout(() => y.focus(), 0); return c;
  }

  function toggleDone(it) {
    const now = !isDone(it.key);
    if (now && !S.showDone) { const order = navOrder(), idx = order.findIndex((i) => i.key === it.key); const next = order[idx + 1] || order[idx - 1]; S.selected = next ? next.key : null; }
    setDone(it.key, now); toast(now ? "Marked as handled" : "Moved back to your list"); render();
  }

  /* ---------- server API ---------- */
  async function api(path, body) {
    const r = await fetch(path, body === undefined ? { headers: { Accept: "application/json" } } : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (r.status === 401) { location.href = "/login"; throw { code: "signed_out", message: "Signed out" }; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw { code: "server", message: j.error || `Server error ${r.status}`, data: j };
    return j;
  }
  function applyState(st) {
    S.serverSources = st.sources || [];
    S.accounts = st.accounts || [];
    S.mail = Object.fromEntries(Object.entries(st.mail || {}).map(([k, v]) => [k, v.map(tagMondayMail)]));
    S.slack = st.slack || [];
    S.mon.tasks = { all: (st.mon && st.mon.tasks) || [] }; S.mon.updates = { all: (st.mon && st.mon.updates) || [] }; S.mon.boards = (st.mon && st.mon.boards) || [];
    S.mailAt = S.slackAt = S.mon.at = st.fetchedAt || 0;
    S.triage = st.triage || null; S.triageAt = st.triageAt || 0;
    S.planning = !!st.planning; S.refreshMin = st.refreshMinutes || 60;
    handled = st.handled || {}; ticks = st.ticks || {}; store.set("handled", handled); store.set("ticks", ticks);
    S.loading = !st.fetchedAt;
    if (st.planError) { $("pageBanner").textContent = "Claude couldn't build the plan last time: " + st.planError; $("pageBanner").hidden = false; } else $("pageBanner").hidden = true;
    S.sample = st.claude ? true : null; $("retriage").hidden = !st.claude;
    render();
    if (!st.fetchedAt || st.refreshing || st.planning) { clearTimeout(load._t); load._t = setTimeout(load, 5000); }
  }
  async function load() {
    try { applyState(await api("/api/state")); }
    catch (e) { if (e.code !== "signed_out") { $("pageBanner").textContent = "Couldn't reach the server. It will try again in a minute."; $("pageBanner").hidden = false; } }
  }

  async function runTriage() {
    if (!S.sample || S.planning) return;
    S.planning = true; const btn = $("retriage"); btn.disabled = true; btn.querySelector("span").textContent = "Planning…"; renderHeader(); renderDetail();
    try { applyState(await api("/api/replan", {})); toast("Day re-planned"); }
    catch (e) { if (e.data && e.data.fetchedAt) applyState(e.data); $("pageBanner").textContent = e.message; $("pageBanner").hidden = false; }
    finally { S.planning = false; btn.disabled = false; btn.querySelector("span").textContent = "Re-plan my day"; render(); }
  }

  async function draft(it) {
    const st = $("dStatus"), btn = $("dDraft");
    st.className = "status"; st.textContent = "Claude is writing…"; btn.disabled = true;
    try {
      const { text } = await api("/api/draft", { key: it.key, instruction: ($("dAsk") && $("dAsk").value.trim()) || "" });
      if (S.selected === it.key) { $("dText").value = text; $("dStatus").textContent = "Draft ready. Edit it, then send."; $("dText").focus(); }
    } catch (e) { if (S.selected === it.key && $("dStatus")) { $("dStatus").className = "status err"; $("dStatus").textContent = e.message; } }
    finally { if ($("dDraft")) $("dDraft").disabled = false; }
  }

  function askSend(it) {
    const text = $("dText").value.trim();
    if (!text) { $("dStatus").className = "status err"; $("dStatus").textContent = "Write a reply first."; $("dText").focus(); return; }
    if (S.confirmFor === it.key) { $("dYes") && $("dYes").focus(); return; }
    S.confirmFor = it.key; $("detail").querySelector(".composer").append(confirmBox(it, true));
  }

  async function send(it) {
    const text = $("dText").value.trim(); if (!text || S.sending) return;
    S.sending = true; $("dYes").disabled = true; const st = $("dStatus"); st.className = "status"; st.textContent = "Sending…";
    try {
      await api("/api/reply", { key: it.key, text });
      S.confirmFor = null; $("dText").value = ""; if ($("dAsk")) $("dAsk").value = "";
      S.sending = false; toggleDone(it);
      toast(it.source === "email" ? "Email sent · marked handled" : it.source === "monday" ? "Posted to Monday · marked handled" : "Sent to Slack · marked handled");
    } catch (e) {
      if ($("dStatus")) { $("dStatus").className = "status err"; $("dStatus").textContent = e.message; }
      if ($("dYes")) $("dYes").disabled = false;
    } finally { S.sending = false; }
  }

  async function boot() { S.mcp = true; render(); await load(); setInterval(load, 5 * 60000); }

  /* ---------- wiring ---------- */
  document.querySelectorAll(".tile").forEach((b) => b.onclick = () => { S.tile = S.tile === b.dataset.tile ? null : b.dataset.tile; S.selected = null; render(); });
  document.querySelectorAll(".seg button").forEach((b) => b.onclick = () => { S.src = b.dataset.src; document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); S.selected = null; render(); });
  $("q").oninput = (e) => { S.q = e.target.value; S.selected = null; renderList(); renderDetail(); };
  $("showDone").onchange = (e) => { S.showDone = e.target.checked; render(); };
  $("refresh").onclick = async () => {
    const b = $("refresh"); b.disabled = true; $("pulse").className = "pulse busy"; $("syncTxt").textContent = "Refreshing…";
    try { applyState(await api("/api/refresh", {})); toast("Up to date"); } catch (e) { toast(e.message); }
    finally { b.disabled = false; clearTimeout(load._t); load._t = setTimeout(load, 20000); }
  };
  $("retriage").onclick = () => runTriage();
  const moveSel = (dir) => { const order = navOrder(); if (!order.length) return; const idx = order.findIndex((i) => i.key === S.selected);
    const n = order[Math.max(0, Math.min(order.length - 1, idx < 0 ? 0 : idx + dir))]; select(n.key);
    const r = document.querySelector(`.row[data-key="${CSS.escape(n.key)}"]`); r && r.scrollIntoView({ block: "nearest" }); };
  document.addEventListener("keydown", (e) => {
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea") { if (e.key === "Escape") e.target.blur(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); moveSel(1); }
    else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); moveSel(-1); }
    else if (e.key === "r" && $("dText")) { e.preventDefault(); $("dText").focus(); }
    else if (e.key === "e") { const it = ITEMS.find((i) => i.key === S.selected); if (it) { e.preventDefault(); toggleDone(it); } }
    else if (e.key === "/") { e.preventDefault(); $("q").focus(); }
    else if (e.key === "Escape" && $("split").classList.contains("show-detail")) $("split").classList.remove("show-detail");
  });
  setInterval(renderHeader, 30000);

  boot();
})();
</script>
</body></html>
